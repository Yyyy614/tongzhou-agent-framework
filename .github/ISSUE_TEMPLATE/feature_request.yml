name: 功能建议
description: 提出通用框架、插件接口或使用体验方面的改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 说明当前行为及其影响，避免提交真实业务资料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 说明是否可以通过独立插件或连接器实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的办法或替代方案
